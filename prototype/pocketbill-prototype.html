<title>PocketBill Prototype</title>

<style>
/* Layout: one phone-width app column (max 440px), centred on wide screens: app bar, scrolling screen, bottom nav. Mirrors the Android build's Material 3 navy theme. */
:root {
  --bg: #f6f8fb; --surface: #ffffff; --surface-2: #e9eff7; --fg: #16212e; --muted: #566476; --line: #d6dee8;
  --primary: #1f4e79; --on-primary: #ffffff; --primary-soft: #d6e4f7; --on-primary-soft: #0d2c4a;
  --paid-bg: #d5f2ec; --paid-fg: #00574e; --due-bg: #e3e9f1; --due-fg: #3c4a5a; --late-bg: #fbe1de; --late-fg: #9c2218;
  --error: #b3261e; --scrim: rgba(10, 16, 24, .45); --banner-bg: #fff4d6; --banner-fg: #5a4300;
  --paper: #ffffff; --paper-ink: #1b222b; --paper-muted: #5f6b78; --paper-line: #dfe4ea; --paper-accent: #1f4e79;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --surface: #171d24; --surface-2: #212a34; --fg: #e3e9f0; --muted: #9eabba; --line: #2d3743;
    --primary: #a6c8ff; --on-primary: #0b2a47; --primary-soft: #26486c; --on-primary-soft: #d6e4f7;
    --paid-bg: #123d38; --paid-fg: #7fe0d0; --due-bg: #26303b; --due-fg: #c3cfdb; --late-bg: #4a1d19; --late-fg: #ffb4ab;
    --error: #ffb4ab; --scrim: rgba(0, 0, 0, .6); --banner-bg: #3a3014; --banner-fg: #f3dc9a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #171d24; --surface-2: #212a34; --fg: #e3e9f0; --muted: #9eabba; --line: #2d3743;
  --primary: #a6c8ff; --on-primary: #0b2a47; --primary-soft: #26486c; --on-primary-soft: #d6e4f7;
  --paid-bg: #123d38; --paid-fg: #7fe0d0; --due-bg: #26303b; --due-fg: #c3cfdb; --late-bg: #4a1d19; --late-fg: #ffb4ab;
  --error: #ffb4ab; --scrim: rgba(0, 0, 0, .6); --banner-bg: #3a3014; --banner-fg: #f3dc9a;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--surface-2); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 440px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; }
@media (min-width: 600px) { .app { border-inline: 1px solid var(--line); } }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.banner { background: var(--banner-bg); color: var(--banner-fg); font-size: 12px; padding-block: 6px; text-align: center; letter-spacing: .01em; }
.appbar { display: flex; align-items: center; gap: 4px; min-height: 56px; background: var(--bg); }
.appbar h1 { font-size: 20px; font-weight: 500; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; margin-left: -10px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 50%; }
.icon-btn:active { background: var(--surface-2); }
svg.i { width: 24px; height: 24px; fill: currentColor; flex: none; }

main.screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; }
.stack { display: flex; flex-direction: column; gap: 16px; padding-block: 4px 24px; }

nav.bottom { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-block: 8px 10px; }
nav.bottom button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); padding: 0; }
nav.bottom .pill { width: 60px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
nav.bottom button[aria-current="page"] { color: var(--fg); }
nav.bottom button[aria-current="page"] .pill { background: var(--primary-soft); color: var(--on-primary-soft); }

.brand { font-size: 32px; font-weight: 400; color: var(--primary); margin: 0; line-height: 1.15; }
.tag { margin: 2px 0 0; color: var(--muted); }
h2.section-h { font-size: 14px; font-weight: 500; color: var(--muted); margin: 8px 0 -6px; letter-spacing: .02em; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.owed .label { font-size: 13px; color: var(--muted); font-weight: 500; }
.owed .amounts { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.owed .amt { font-size: 26px; font-weight: 500; line-height: 1.2; }
.owed .sub { margin-top: 8px; font-size: 13px; color: var(--muted); }
.owed .sub b { color: var(--late-fg); font-weight: 500; }

.btn { border: 0; border-radius: 22px; min-height: 44px; padding: 0 20px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.tonal { background: var(--primary-soft); color: var(--on-primary-soft); }
.btn.text { background: transparent; color: var(--primary); padding: 0 12px; }
.btn.outline { background: transparent; color: var(--primary); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn.danger { background: transparent; color: var(--error); border: 1px solid var(--line); }
.btn svg.i { width: 20px; height: 20px; }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; min-height: 64px; }
.row:last-child { border-bottom: 0; }
button.row:active { background: var(--surface-2); }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 13px; color: var(--muted); }
.row .end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.row .amt { font-weight: 500; }

.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; }
.chip.paid { background: var(--paid-bg); color: var(--paid-fg); }
.chip.unpaid { background: var(--due-bg); color: var(--due-fg); }
.chip.overdue { background: var(--late-bg); color: var(--late-fg); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line); background: transparent; border-radius: 8px; height: 34px; padding: 0 14px; font-size: 14px; font-weight: 500; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--primary-soft); color: var(--on-primary-soft); border-color: transparent; }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 18px; font-weight: 400; margin-bottom: 4px; }

/* Form */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .flabel { font-size: 13px; font-weight: 500; color: var(--muted); }
.input, select.input { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 1px var(--primary); }
.input.invalid { border-color: var(--error); }
.hint { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.newclient { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.item { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.item .head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 500; }
.item .linetotal { font-size: 14px; text-align: right; color: var(--muted); }
.item .rm { border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 6px 4px; }
.qp { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.totals { display: flex; flex-direction: column; gap: 4px; }
.totals .l { display: flex; justify-content: space-between; color: var(--muted); }
.totals .l.grand { color: var(--fg); font-size: 18px; font-weight: 500; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
.errors { color: var(--error); font-size: 14px; margin: 0; padding-left: 18px; }
.actions { position: sticky; bottom: 0; margin-top: auto; background: var(--bg); border-top: 1px solid var(--line); padding-block: 12px; display: flex; gap: 10px; }
.actions .btn { flex: 1; }

/* Detail */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; }
.dhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dhead .big { font-size: 28px; font-weight: 500; }
.btncol { display: flex; flex-direction: column; gap: 10px; }

/* PDF paper: always white, like the real file */
.paperwrap { background: var(--surface-2); border-radius: 12px; padding: 12px; }
.paper { background: var(--paper); color: var(--paper-ink); width: 100%; aspect-ratio: 1 / 1.414; padding: 7% 7% 6%; font-size: clamp(8.5px, 2.5vw, 11px); line-height: 1.4; box-shadow: 0 1px 3px rgba(0,0,0,.18); position: relative; display: flex; flex-direction: column; gap: 1.8em; }
.p-top { display: flex; justify-content: space-between; gap: 1em; }
.p-biz { font-size: 1.5em; font-weight: 700; }
.p-muted { color: var(--paper-muted); }
.p-title { text-align: right; font-size: 1.9em; font-weight: 300; letter-spacing: .12em; color: var(--paper-accent); }
.p-no { font-size: .5em; letter-spacing: .02em; color: var(--paper-ink); font-weight: 500; }
.p-meta { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1em; }
.p-lab { text-transform: uppercase; letter-spacing: .08em; font-size: .8em; color: var(--paper-muted); margin-bottom: .2em; }
.p-dates { display: grid; grid-template-columns: auto auto; gap: .15em 1em; justify-content: end; }
.p-dates span:nth-child(odd) { color: var(--paper-muted); }
.p-items { width: 100%; border-collapse: collapse; }
.p-items th { text-align: left; font-weight: 500; font-size: .85em; text-transform: uppercase; letter-spacing: .06em; color: var(--paper-muted); border-bottom: 1.5px solid var(--paper-ink); padding: .4em 0; }
.p-items td { padding: .55em 0; border-bottom: 1px solid var(--paper-line); vertical-align: top; }
.p-items .r { text-align: right; white-space: nowrap; padding-left: 1em; }
.p-totals { margin-left: auto; width: 55%; display: grid; grid-template-columns: 1fr auto; gap: .3em 1em; }
.p-totals .g { font-weight: 700; font-size: 1.25em; border-top: 1.5px solid var(--paper-ink); padding-top: .3em; }
.p-foot { margin-top: auto; color: var(--paper-muted); border-top: 1px solid var(--paper-line); padding-top: .8em; }
.p-stamp { position: absolute; top: 34%; right: 9%; transform: rotate(-12deg); border: 3px solid #1a7f5a; color: #1a7f5a; font-weight: 700; font-size: 2.6em; letter-spacing: .15em; padding: .05em .4em; border-radius: 6px; opacity: .8; }

/* Sheet + snackbar (fixed to screen edges; add safe-area insets) */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(440px, 100%); background: var(--surface); border-radius: 20px 20px 0 0; padding-top: 10px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet .grab { width: 32px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.sheet h3 { margin: 0 0 4px; font-size: 16px; font-weight: 500; }
.sheet .file { display: flex; gap: 12px; align-items: center; padding-block: 8px 16px; border-bottom: 1px solid var(--line); }
.sheet .fileicon { width: 40px; height: 48px; border-radius: 4px; background: var(--paper); border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #b3261e; }
.targets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; padding-block: 16px 8px; }
.target { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
.target .av { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; }
.snack { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(408px, calc(100% - 32px)); background: var(--fg); color: var(--bg); border-radius: 8px; padding: 12px 8px 12px 16px; display: flex; align-items: center; gap: 8px; z-index: 20; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.snack span { flex: 1; }
.snack button { border: 0; background: transparent; color: var(--primary-soft); font-weight: 700; padding: 8px; }

/* Sending (UX_SPEC section 4) */
.sendblock { display: flex; flex-direction: column; gap: 6px; }
.sendblock .btn.text { align-self: center; }
.sendmeta { font-size: 13px; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
.sendmeta.sent { color: var(--paid-fg); display: flex; gap: 4px; align-items: center; justify-content: center; font-weight: 500; }
.sendmeta.sent svg.i { width: 16px; height: 16px; }
.iconrow { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.iconrow button { border: 1px solid var(--line); background: transparent; border-radius: 12px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 500; color: var(--primary); }
.actions .btn.primary.wide { flex: 2; }
.mailwrap { position: fixed; inset: 0; z-index: 15; display: flex; justify-content: center; background: var(--scrim); }
.mail { width: min(440px, 100%); height: 100%; background: var(--surface); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.mailbar { display: flex; align-items: center; gap: 8px; min-height: 56px; border-bottom: 1px solid var(--line); }
.mailbar h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 500; }
.mailnote { font-size: 12px; background: var(--banner-bg); color: var(--banner-fg); padding-block: 6px; }
.mailbody { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
.mrow { display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); min-height: 52px; }
.mrow span { color: var(--muted); width: 60px; font-size: 14px; flex: none; }
.mrow input { flex: 1; min-width: 0; border: 0; background: transparent; min-height: 48px; }
.mrow input.invalid { box-shadow: inset 0 -2px 0 var(--error); }
.attach { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; margin-block: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; max-width: 100%; overflow-wrap: anywhere; }
.attach svg.i { color: var(--error); }
.mailbody textarea { flex: 1; min-height: 260px; border: 0; background: transparent; resize: none; line-height: 1.5; padding-block: 4px 16px; }

.loglist { font-size: 13px; display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; }
.loglist div { display: grid; grid-template-columns: 52px 1fr; gap: 8px; }
.loglist time { color: var(--muted); }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); min-height: 56px; }
.setrow:last-child { border-bottom: 0; }
.setrow .s { font-size: 13px; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .2s ease-out; }
  .snack { animation: fade .15s ease-out; }
  @keyframes up { from { transform: translateY(30%); opacity: .4; } }
  @keyframes fade { from { opacity: 0; } }
}
</style>

<div class="app" id="app">
  <div class="banner gut" role="note">Prototype for user testing. Nothing is saved to a server or sent.</div>
  <header class="appbar gut" id="appbar"></header>
  <main class="screen" id="screen"></main>
  <nav class="bottom gut" id="nav" aria-label="Main"></nav>
</div>
<div id="overlay"></div>

  }
  function markSent(inv, via) {
    var prev = { at: inv.lastSentAt, via: inv.lastSentVia };
    inv.lastSentAt = Date.now(); inv.lastSentVia = via;
    log("Sent " + invNo(inv.no) + " via " + via);
    persist(); render(false);
    return function () { inv.lastSentAt = prev.at; inv.lastSentVia = prev.via; log("Undo sent " + invNo(inv.no)); persist(); render(false); };
  }
  function openEmail(inv) {
    var cl = clientOf(inv);
    log("Opened email app for " + invNo(inv.no));
    var subj = (inv.status === "paid" ? "Receipt for invoice " : "Invoice ") + invNo(inv.no) + " from " + BUSINESS.name;
    var wrap = document.createElement("div");
    wrap.className = "mailwrap";
    wrap.innerHTML = '<div class="mail" role="dialog" aria-modal="true" aria-label="Email app (simulated)">' +
      '<div class="mailbar gut"><button class="icon-btn" data-m="close" aria-label="Discard email">' + icon("close") + '</button><h2>Email app</h2><button class="btn primary" data-m="send">' + icon("send") + "Send</button></div>" +
      '<div class="mailnote gut">Simulated email app. Nothing is actually sent.</div>' +
      '<div class="mailbody gut"><label class="mrow"><span>To</span><input id="m-to" type="email" inputmode="email" value="' + esc(cl.email) + '"></label>' +
      '<label class="mrow"><span>Subject</span><input id="m-subj" value="' + esc(subj) + '"></label>' +
      '<div class="attach">' + icon("pdf") + "<span>" + invNo(inv.no) + "_" + esc(fileSafe(cl.name)) + ".pdf</span></div>" +
      '<textarea id="m-body" aria-label="Message">' + esc(mailBody(inv)) + "</textarea></div></div>";
    wrap.addEventListener("click", function (e) {
      var b = e.target.closest("[data-m]"); if (!b) return;
      if (b.getAttribute("data-m") === "close") { wrap.remove(); log("Closed email app without sending"); return; }
      var to = wrap.querySelector("#m-to");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to.value.trim())) { to.classList.add("invalid"); to.focus(); log("Email send blocked: no valid address"); return; }
      wrap.remove();
      var undo = markSent(inv, "Email");
      toast("Sent to " + cl.name + " by email. (Prototype: nothing was sent.)", undo);
    });
    document.getElementById("overlay").appendChild(wrap);
  }
  function openAddEmail(inv) {
    var cl = clientOf(inv);
    log("Opened Add client email");
    var wrap = document.createElement("div");
    wrap.className = "scrim";
    wrap.innerHTML = '<div class="sheet gut" role="dialog" aria-modal="true" aria-label="Add client email"><div class="grab"></div>' +
      "<h3>Email for " + esc(cl.name) + "</h3>" +
      '<div class="field" style="margin-top:12px"><label for="f-addemail">Email address</label><input id="f-addemail" class="input" type="email" inputmode="email" autocomplete="off" placeholder="name@company.com"></div>' +
      '<div class="hint" id="addemail-err" role="alert" style="color:var(--error);min-height:20px"></div>' +
      '<div style="display:flex;gap:10px;margin-top:8px"><button class="btn outline" data-m="cancel" style="flex:1">Cancel</button><button class="btn primary" data-m="save" style="flex:1">Save</button></div></div>';
    wrap.addEventListener("click", function (e) {
      var b = e.target.closest("[data-m]");
      if (!b) { if (e.target === wrap) { wrap.remove(); log("Closed Add client email"); } return; }
      if (b.getAttribute("data-m") === "cancel") { wrap.remove(); log("Closed Add client email"); return; }
      var v = wrap.querySelector("#f-addemail").value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { wrap.querySelector("#addemail-err").textContent = "Enter an email address like name@company.com."; return; }
      cl.email = v; wrap.remove();
      log("Added email for " + cl.name);
      persist(); render(false);
      toast("Email saved. You can now email this invoice in one tap.");
    });
    document.getElementById("overlay").appendChild(wrap);
    wrap.querySelector("#f-addemail").focus();
  }

  function titleFor(r) {
    if (r.name === "detail") return invNo(invById(r.params.id).no);
    if (r.name === "editor") return ui.draft && ui.draft.id ? "Edit " + invNo(invById(ui.draft.id).no) : "New invoice";
    if (r.name === "preview") return "Preview · " + invNo(invById(r.params.id).no);
    return r.name === "home" ? "" : LABELS[r.name];
  }

  // ---------- Editor helpers ----------
  function startDraft(inv) {
    if (inv) {
      ui.draft = { id: inv.id, clientId: inv.clientId, nc: { name: "", country: "", email: "" }, currency: inv.currency, dueDays: inv.dueDays, tax: String(inv.tax || 0),
        items: inv.items.map(function (it) { return { d: it.d, q: String(it.q), p: (it.p / 100).toFixed(2) }; }) };
    } else {
      ui.draft = { id: null, clientId: "", nc: { name: "", country: "", email: "" }, currency: state.defaultCurrency, dueDays: 30, tax: "0", items: [{ d: "", q: "1", p: "" }] };
    }
    ui.errors = [];
  }
  function draftNumbers() {
    var d = ui.draft, sub = 0, lines = [];
    d.items.forEach(function (it) {
      var q = parseQty(it.q), p = parseMoney(it.p);
      var lt = q != null && p != null ? Math.round(q * p) : null;
      lines.push(lt); if (lt != null) sub += lt;
    });
    var rate = parseQty(d.tax) || 0;
    var tax = Math.round(sub * rate / 100);
    return { lines: lines, sub: sub, tax: tax, rate: rate, total: sub + tax };
  }
  function updateLive() {
    var d = ui.draft; if (!d) return;
    var n = draftNumbers();
    n.lines.forEach(function (lt, i) { var el = document.getElementById("lt-" + i); if (el) el.textContent = lt != null && lt > 0 ? "Line total " + money(lt, d.currency) : ""; });
    var t = document.getElementById("totals");
    if (t) t.innerHTML = '<div class="l"><span>Subtotal</span><span class="num">' + money(n.sub, d.currency) + "</span></div>" +
      (n.rate ? '<div class="l"><span>Tax (' + n.rate + '%)</span><span class="num">' + money(n.tax, d.currency) + "</span></div>" : "") +
      '<div class="l grand"><span>Total</span><span class="num">' + money(n.total, d.currency) + "</span></div>";
    var h = document.getElementById("duehint");
    if (h) { var issued = d.id ? invById(d.id).issued : today0(); h.textContent = "Issued " + fmtDate(issued) + " · due " + fmtDate(issued + d.dueDays * DAY); }
  }
  function errorText() {
    var map = { client: "Choose a client, or pick “+ New client…”.", cname: "Enter the new client's name.", items: "Add at least one item with a description and a price." };
    var out = [];
    ui.errors.forEach(function (e) {
      if (map[e]) out.push(map[e]);
      else if (e[0] === "d") out.push("Item " + (+e.slice(1) + 1) + ": add a description.");
      else if (e[0] === "q") out.push("Item " + (+e.slice(1) + 1) + ": quantity must be a number above 0.");
      else if (e[0] === "p") out.push("Item " + (+e.slice(1) + 1) + ": enter a price, e.g. 450 or 450.00.");
    });
    return out;
  }
  function validate() {
    var d = ui.draft, errs = [];
    if (!d.clientId) errs.push("client");
    if (d.clientId === "__new" && !d.nc.name.trim()) errs.push("cname");
    var any = false;
    d.items.forEach(function (it, i) {
      var blank = !it.d.trim() && !String(it.p).trim();
      if (blank && d.items.length > 1) return;
      if (!it.d.trim()) errs.push("d" + i);
      var q = parseQty(it.q); if (q == null || q <= 0) errs.push("q" + i);
      var p = parseMoney(it.p); if (p == null || p <= 0) errs.push("p" + i);
      if (it.d.trim() && p > 0) any = true;
    });
    if (!any && errs.length === 0) errs.push("items");
    return errs;
  }
  function saveDraft() {
    var d = ui.draft;
    ui.errors = validate();
    if (ui.errors.length) { log("Save blocked: " + errorText().join(" ")); render(false); var first = document.querySelector(".invalid"); if (first) first.focus(); return; }
    var clientId = d.clientId;
    if (clientId === "__new") {
      clientId = "c" + Date.now();
      state.clients.push({ id: clientId, name: d.nc.name.trim(), country: d.nc.country.trim(), email: d.nc.email.trim() });
      log("Added client " + d.nc.name.trim() + (d.nc.country.trim() ? " (" + d.nc.country.trim() + ")" : ""));
    }
    var items = d.items.filter(function (it) { return it.d.trim() || String(it.p).trim(); }).map(function (it) { return { d: it.d.trim(), q: parseQty(it.q), p: parseMoney(it.p) }; });
    var tax = parseQty(d.tax) || 0;
    var inv;
    if (d.id) {
      inv = invById(d.id);
      var before = calc(inv).total, beforeCur = inv.currency;
      inv.clientId = clientId; inv.currency = d.currency; inv.dueDays = d.dueDays; inv.items = items; inv.tax = tax;
      log("Edited " + invNo(inv.no) + ": total " + money(before, beforeCur) + " → " + money(calc(inv).total, inv.currency) + " (" + items.length + " items)");
      ui.draft = null;
      stack.pop();
      if (current().name === "preview" && current().params.id === inv.id) { log("Opened PDF preview (" + invNo(inv.no) + ")"); render(true); }
      else go("preview", { id: inv.id });
    } else {
      inv = { id: "i" + Date.now(), no: state.nextNo++, clientId: clientId, currency: d.currency, items: items, tax: tax, issued: today0(), dueDays: d.dueDays, status: "unpaid" };
      state.invoices.push(inv);
      log("Created " + invNo(inv.no) + " · " + clientOf(inv).name + " · " + money(calc(inv).total, inv.currency) + " · due " + (inv.dueDays ? "in " + inv.dueDays + " days" : "on receipt"));
      ui.draft = null;
      stack.pop();
      stack.push({ name: "detail", params: { id: inv.id } });
      go("preview", { id: inv.id });
    }
    persist();
  }

  // ---------- Overlays ----------
  var snackTimer;
  function toast(msg, undo) {
    var o = document.getElementById("overlay");
    var old = o.querySelector(".snack"); if (old) old.remove();
    clearTimeout(snackTimer);
    var el = document.createElement("div");
    el.className = "snack"; el.setAttribute("role", "status");
    el.innerHTML = "<span>" + esc(msg) + "</span>" + (undo ? "<button>Undo</button>" : "");
    if (undo) el.querySelector("button").addEventListener("click", function () { el.remove(); undo(); });
    o.appendChild(el);
    snackTimer = setTimeout(function () { el.remove(); }, undo ? 6000 : 4500);
  }
  function openShare(inv) {
    log("Opened share sheet for " + invNo(inv.no));
    var cl = clientOf(inv);
    var o = document.getElementById("overlay");
    var wrap = document.createElement("div");
    wrap.className = "scrim";
    wrap.innerHTML = '<div class="sheet gut" role="dialog" aria-modal="true" aria-label="Share invoice"><div class="grab"></div>' +
      '<div class="file"><div class="fileicon">PDF</div><div style="min-width:0"><h3>' + invNo(inv.no) + ".pdf</h3><div class=\"hint\">" + esc(cl.name) + " · " + money(calc(inv).total, inv.currency) + "</div></div></div>" +
      '<div class="targets">' + SHARE_TARGETS.map(function (t) { return '<button class="target" data-t="' + t[0] + '"><span class="av" style="background:' + t[1] + '">' + t[0][0] + "</span>" + t[0] + "</button>"; }).join("") + "</div>" +
      '<button class="btn text block" data-t="">Cancel</button></div>';
    wrap.addEventListener("click", function (e) {
      var b = e.target.closest("[data-t]");
      if (!b && e.target !== wrap) return;
      wrap.remove();
      var t = b ? b.getAttribute("data-t") : "";
      if (t === "Copy") { log("Copied PDF for " + invNo(inv.no)); toast("PDF copied. (Prototype: nothing was copied.)"); }
      else if (t) { var undo = markSent(inv, t); toast("Sent to " + cl.name + " via " + t + ". (Prototype: nothing was sent.)", undo); }
      else log("Closed share sheet without sharing");
    });
    o.appendChild(wrap);
    var first = wrap.querySelector(".target"); if (first) first.focus();
  }

  // ---------- Render ----------
  function render(scrollTop) {
    var r = current();
    var root = stack[0].name;
    var bar = document.getElementById("appbar");
    var title = titleFor(r);
    bar.innerHTML = (stack.length > 1 ? '<button class="icon-btn" data-act="back" aria-label="Back">' + icon("back") + "</button>" : "") + "<h1>" + esc(title) + "</h1>";
    bar.hidden = !title && stack.length === 1;
    document.getElementById("nav").innerHTML = TABS.map(function (t) {
      return '<button data-act="tab" data-v="' + t[0] + '"' + (root === t[0] ? ' aria-current="page"' : "") + '><span class="pill">' + icon(t[0]) + "</span>" + t[1] + "</button>";
    }).join("");
    var scr = document.getElementById("screen");
    scr.innerHTML = screens[r.name](r.params || {});
    if (r.name === "editor") updateLive();
    if (scrollTop) scr.scrollTop = 0;
  }

  // ---------- Events ----------
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
    switch (act) {
      case "tab": tab(b.getAttribute("data-v")); break;
      case "back": back(); break;
      case "new": startDraft(null); go("editor"); break;
      case "open": go("detail", { id: id }); break;
      case "filter": ui.filter = b.getAttribute("data-v"); log("Filter: " + ui.filter); render(false); break;
      case "preview": go("preview", { id: id }); break;
      case "edit": startDraft(invById(id)); go("editor"); break;
      case "pay": case "unpay": {
        var inv = invById(id);
        var prev = { status: inv.status, paidOn: inv.paidOn };
        inv.status = act === "pay" ? "paid" : "unpaid"; inv.paidOn = act === "pay" ? today0() : undefined;
        log((act === "pay" ? "Marked paid " : "Marked unpaid ") + invNo(inv.no));
        persist(); render(false);
        toast(invNo(inv.no) + (act === "pay" ? " marked as paid" : " marked as unpaid"), function () { inv.status = prev.status; inv.paidOn = prev.paidOn; log("Undo on " + invNo(inv.no)); persist(); render(false); });
        break;
      }
      case "share": openShare(invById(id)); break;
      case "email": openEmail(invById(id)); break;
      case "addemail": openAddEmail(invById(id)); break;
      case "savepdf": { var i2 = invById(id); log("Tapped Save PDF for " + invNo(i2.no)); toast("Saved " + invNo(i2.no) + ".pdf to Downloads. (Prototype: no file was created.)"); break; }
      case "due": ui.draft.dueDays = +b.getAttribute("data-v"); render(false); break;
      case "additem": ui.draft.items.push({ d: "", q: "1", p: "" }); render(false); var n = document.getElementById("f-d-" + (ui.draft.items.length - 1)); if (n) n.focus(); break;
      case "rmitem": ui.draft.items.splice(+b.getAttribute("data-i"), 1); ui.errors = []; render(false); break;
      case "cancel": ui.draft = null; back(); break;
      case "save": saveDraft(); break;
      case "backup": log("Tapped Back up now"); toast("Backup saved. (Prototype: no file was created.)"); break;
      case "reset":
        if (!ui.resetArmed) { ui.resetArmed = true; render(false); setTimeout(function () { if (ui.resetArmed) { ui.resetArmed = false; if (current().name === "settings") render(false); } }, 4000); }
        else { ui.resetArmed = false; state = seed(); persist(); ui.filter = "all"; stack = [{ name: "home" }]; render(true); toast("Prototype reset. Ready for the next participant."); }
        break;
    }
  });
  document.addEventListener("input", function (e) {
    var d = ui.draft, el = e.target, id = el.id || "";
    if (!d) return;
    var m = id.match(/^f-([dqp])-(\d+)$/);
    if (m) d.items[+m[2]][m[1]] = el.value;
    else if (id === "f-tax") d.tax = el.value;
    else if (id === "f-cname") d.nc.name = el.value;
    else if (id === "f-ccountry") d.nc.country = el.value;
    else if (id === "f-cemail") d.nc.email = el.value;
    else return;
    if (el.classList.contains("invalid")) el.classList.remove("invalid");
    updateLive();
  });
  document.addEventListener("change", function (e) {
    var id = e.target.id;
    if (id === "f-client") { ui.draft.clientId = e.target.value; ui.errors = ui.errors.filter(function (x) { return x !== "client"; }); render(false); if (e.target.value === "__new") { var f = document.getElementById("f-cname"); if (f) f.focus(); } }
    else if (id === "f-cur") { ui.draft.currency = e.target.value; render(false); }
    else if (id === "f-defcur") { state.defaultCurrency = e.target.value; log("Default currency set to " + e.target.value); persist(); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { var s = document.querySelector(".scrim"); if (s) s.click(); } });

  if (!state.log.length) log("Prototype opened");
  render(true);
})();
</script>
